<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Part 1: The Essentials – Questionnaire</title>
<!--
  =====================================================================
  HOW TO CONNECT THE "SEND" BUTTON TO YOUR EMAIL  (edit CONFIG below)
  =====================================================================
  Option A – FormSubmit (easiest, no account):
    1. Set provider: "formsubmit" and email: "you@yourdomain.co.uk" (Gmail works too).
    2. Upload this file to your website (or open it once) and send ONE test submission.
    3. FormSubmit emails you an activation link – click it. Done.
       Tip: after activating, FormSubmit gives you a random alias (e.g. a1b2c3...).
       Put that in "email" instead of your real address to hide it from spam bots.

  Option B – Web3Forms (free account, very reliable):
    1. Go to web3forms.com, enter your email, and copy the Access Key they send.
    2. Set provider: "web3forms" and accessKey: "your-key-here".

  Option C – Formspree:
    1. Create a form at formspree.io and copy the form ID (e.g. "xyzabcd").
    2. Set provider: "formspree" and formspreeId: "xyzabcd".

  Note: this questionnaire collects business information only – it does NOT
  ask for any patient details, so a standard form service is appropriate.
  =====================================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E0F12; --muted:#868A94; --muted-2:#A3A6AF;
    --soft:#F4F4F8; --field:#FBFBFD; --line:#D5D7E4; --chip-line:#C9CBDD; --chip-hover:#A7AAC4;
    --lime:#C4F57E; --lime-strong:#B1EC5E; --lime-ink:#16220A; --lime-wash:#F3FCE6;
    --error:#D2463A; --card-radius:40px; --radius:16px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.55 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;
    background:linear-gradient(180deg,#EFF0F3 0%,#E2E4E8 55%,#D6D9DE 100%) fixed}
  h1,h2,h3{font-family:"Bricolage Grotesque","Inter",system-ui,sans-serif;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:0}
  a{color:var(--ink)}

  .shell{max-width:680px;margin:0 auto;padding:56px 16px 48px}
  .card{position:relative;background:linear-gradient(180deg,#FFFFFF 72%,#FAFAFD 100%);border:1px solid #DCDEE7;border-radius:var(--card-radius);
    padding:36px 34px 32px;box-shadow:0 1px 0 #fff inset,0 40px 70px -40px rgba(24,26,44,.25)}
  @media (max-width:560px){.shell{padding:20px 12px 32px}.card{padding:26px 18px 22px;border-radius:28px}}

  /* Logo */
  .logo{display:block;height:40px;width:auto;margin:0 0 24px}
  @media (max-width:560px){.logo{height:34px;margin-bottom:20px}}

  /* Top bar + progress */
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
  .savednote{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted-2)}
  .savednote .dot{width:7px;height:7px;border-radius:50%;background:var(--lime-strong)}
  .progress{height:4px;background:#ECECF0;border-radius:999px;margin:12px 0 0;overflow:hidden}
  .progress .fill{height:100%;width:0;background:var(--lime);border-radius:999px;transition:width .4s ease}

  /* Steps */
  .step{display:none;animation:fade .3s ease}
  .step.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .step-head{margin:26px 0 28px}
  .step-head h2{font-size:clamp(26px,4.2vw,32px);outline:none}
  .step-head p{margin:12px 0 0;color:var(--muted);font-size:16px}

  /* Questions */
  .q{border:0;margin:0 0 26px;padding:0;min-width:0}
  .q > .qlabel,.q > legend{display:block;font-weight:500;font-size:15px;margin-bottom:10px;padding:0;color:var(--ink)}
  .req{color:var(--error);margin-left:2px}
  .optional{font-weight:400;color:var(--muted-2);font-size:13px;margin-left:6px}
  .hint{color:var(--muted);font-size:14px;margin:-4px 0 12px}
  input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],textarea,select{
    width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none}
  input::placeholder,textarea::placeholder{color:var(--muted-2)}
  textarea{min-height:120px;resize:vertical}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--lime-strong);box-shadow:0 0 0 4px rgba(196,245,126,.45);background:#fff}
  .q.invalid input,.q.invalid textarea{border-color:var(--error)}
  .errmsg{display:none;color:var(--error);font-size:13px;margin-top:8px;font-weight:500}
  .q.invalid .errmsg{display:block}

  /* Pill chips */
  .options{display:flex;flex-wrap:wrap;gap:10px}
  .opt{position:relative;display:inline-flex;align-items:center;gap:10px;padding:11px 20px;border:1px solid var(--chip-line);border-radius:999px;
    background:#fff;cursor:pointer;font-size:16px;line-height:1.3;color:var(--ink);transition:background .15s,border-color .15s,padding .15s}
  .opt:hover{border-color:var(--chip-hover)}
  .opt input{position:absolute;opacity:0;pointer-events:none}
  .opt .box{display:none;flex:0 0 22px;width:22px;height:22px;border-radius:50%;background:var(--lime);place-items:center}
  .opt .box svg{width:13px;height:13px}
  .opt:has(input:checked){background:var(--soft);border-color:#D9DAE6;padding-left:11px}
  .opt:has(input:checked) .box{display:grid}
  .opt:has(input:focus-visible){outline:3px solid var(--lime-strong);outline-offset:2px}
  .other-input{margin-top:12px;display:none}
  .other-input.show{display:block}

  /* In-page subheadings */
  .subhead{margin:36px 0 22px;padding-top:28px;border-top:1px solid #EDEEF3}
  .subhead h3{font-size:21px}
  .subhead p{margin:6px 0 0;color:var(--muted);font-size:14px}

  /* Welcome tips */
  .tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:0 0 30px}
  .tip{background:var(--soft);border-radius:18px;padding:14px 16px;font-size:14px;color:var(--muted)}
  .tip strong{display:block;font-size:15px;font-weight:600;color:var(--ink);margin-bottom:2px}

  /* Buttons */
  .actions{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:34px}
  .btn{font:inherit;font-size:16px;font-weight:600;border:0;border-radius:var(--radius);padding:15px 32px;min-width:112px;cursor:pointer;transition:background .15s,transform .1s;color:var(--ink)}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--lime)}
  .btn-primary:hover{background:var(--lime-strong)}
  .btn-ghost{background:#EFEFF3}
  .btn-ghost:hover{background:#E5E5EB}
  .btn:focus-visible{outline:3px solid var(--lime-strong);outline-offset:2px}
  .btn[disabled]{opacity:.6;cursor:wait}
  @media (max-width:420px){.actions .btn{flex:1;min-width:0;padding:15px 16px}}

  /* Review */
  .review-section{border:1px solid #E6E7EF;border-radius:20px;margin-bottom:12px;overflow:hidden}
  .review-section header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#F7F7FA}
  .review-section h3{font-size:17px}
  .review-section dl{margin:0;padding:4px 18px 14px}
  .review-section dt{font-weight:500;font-size:14px;margin-top:12px}
  .review-section dd{margin:2px 0 0;color:var(--muted);font-size:14px;white-space:pre-wrap}
  .review-section dd.empty{font-style:italic;color:var(--muted-2)}
  .linkbtn{all:unset;cursor:pointer;font-weight:600;font-size:14px;padding:6px 14px;border-radius:999px;background:#fff;border:1px solid var(--chip-line)}
  .linkbtn:hover{border-color:var(--chip-hover)}
  .linkbtn:focus-visible{outline:3px solid var(--lime-strong)}
  .callout{background:var(--lime-wash);border:1px solid #DDF3BF;color:#2A3815;border-radius:18px;padding:14px 18px;margin:0 0 20px;font-size:14px}

  .banner{display:none;border-radius:16px;padding:14px 16px;margin-top:16px;font-weight:500;font-size:14px}
  .banner.error{display:block;background:#FDECEA;color:var(--error)}

  /* Thank you */
  .thanks{text-align:center;padding:30px 6px 10px}
  .thanks .tick{width:72px;height:72px;margin:0 auto 20px;border-radius:50%;background:var(--lime);display:grid;place-items:center}
  .thanks h2{font-size:30px;margin-bottom:12px}
  .thanks p{color:var(--muted);max-width:480px;margin:0 auto 10px}
  .hp{position:absolute;left:-9999px}

  /* Below the card */
  .brandmark{text-align:center;margin:30px 0 6px;font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#3E414A}
  .footnote{text-align:center;margin:0;color:var(--muted);font-size:13px}

  @media print{
    body{background:#fff}.topbar,.progress,.actions,.brandmark,.footnote{display:none!important}
    .card{box-shadow:none;border:0;padding:0}.step{display:block!important}
  }
</style>
</head>
<body>

<main class="shell">
  <div class="card">
    <img src="/assets/eb-logo.png" alt="EB" class="logo" width="52" height="40">
    <div class="topbar" id="topbar">
      <span id="progressLabel">Step 1</span>
      <span class="savednote" id="savedNote"><span class="dot"></span>Saved on this device</span>
    </div>
    <div class="progress" id="progress"><div class="fill" id="progressFill"></div></div>

    <form id="qform" novalidate>
      <div id="steps"></div>
      <!-- spam trap: leave empty -->
      <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    </form>

    <div class="actions" id="actions">
      <button type="button" class="btn btn-ghost" id="backBtn">Back</button>
      <button type="button" class="btn btn-primary" id="nextBtn">Next</button>
    </div>
    <div class="banner" id="banner" role="alert"></div>
  </div>

  <p class="brandmark" id="brandmark">Project questionnaire</p>
  <p class="footnote">Your answers are only sent when you press <strong>Send my answers</strong> on the last step.</p>
</main>

<script>
/* =========================== SETTINGS =========================== */
const CONFIG = {
  provider: "formsubmit",            // "formsubmit" | "web3forms" | "formspree"
  email: "webmaster@estherbodylawson.com", // for FormSubmit: where answers are sent
  accessKey: "",                     // for Web3Forms
  formspreeId: "",                   // for Formspree
  subject: "Part 1 (essentials) – Midwifery website & care system",
  // Supabase: every submission is saved here (visitors can submit, never read)
  supabaseUrl: "https://gutmdaqopzfmxrvdtfjk.supabase.co",
  supabaseKey: "sb_publishable_KPIHAskgUCApDZ0LXmopcA_BwfR7kGS",   // publishable key – safe in the browser
  part: "part1"
};
const PAGE = { label: "Project questionnaire · Part 1 of 2", time: "About 10 minutes" };
/* ================================================================ */

const NS = ["Not sure"];
const SECTIONS = [
  { id:"welcome", title:"About you & your practice", intro:"A little about you and your new practice. Whenever you don’t know an answer, just pick “Not sure” — that’s completely fine.", welcome:true, questions:[
    {id:"contact_name", label:"Your full name", type:"text", required:true},
    {id:"contact_role", label:"Your role", hint:"For example: owner, lead midwife, practice manager.", type:"text"},
    {id:"contact_email", label:"Your email address", type:"email", required:true},
    {id:"contact_phone", label:"Your phone number", type:"tel"},
    {id:"org_name", label:"Name of your practice or organisation", type:"text", required:true},
    {type:"heading", label:"Your practice", hint:"This helps us understand which rules apply to you."},
    {id:"org_type", label:"How is your practice set up?", type:"radio", options:["I work on my own (self-employed midwife)","A group practice or partnership","A limited company","A charity or social enterprise",...NS]},
    {id:"funding", label:"Who will pay for the care you provide?", type:"radio", options:["Patients pay privately","The NHS pays","A mix of both",...NS]},
    {id:"patients_expected", label:"How many patients do you expect to look after in your first year?", type:"radio", options:["Under 50","50–100","100–200","More than 200",...NS]},
    {id:"staff_count", label:"How many people will work with you at the start?", type:"radio", options:["Just me","2–5","6–10","More than 10"]},
    {id:"regulator", label:"Where are you with CQC registration?", hint:"As a new provider in England, you will usually need to be registered with the CQC (Care Quality Commission) before you start seeing patients.", type:"radio", options:["We are registered","We have applied","Not started yet",...NS]},
    {id:"ico", label:"Have you registered with the ICO and paid the yearly data protection fee?", hint:"The ICO (Information Commissioner’s Office) looks after data protection. For a small practice the fee is about £52 a year.", type:"radio", options:["Yes","Not yet",...NS]},
    {id:"key_people", label:"Who do you already have for these roles?", hint:"Tick any that apply. It’s fine if you have none yet — we’ll guide you.", type:"checkbox", options:["A lead midwife who can check the clinical side","Someone responsible for data protection","One person who makes final decisions","None yet",...NS]}
  ]},
  { id:"launch", title:"What you need at launch", intro:"We’ll build the first version (MVP) with only what you need to open. Everything else can be added later.", questions:[
    {id:"services", label:"Which services will you offer?", hint:"Tick all that apply.", type:"checkbox", other:true, options:["Antenatal care","Home birth support","Hospital or birth centre support","Postnatal care","Newborn checks","Feeding support","Tongue-tie assessment or treatment","Antenatal classes","Hypnobirthing","Wellbeing (e.g. pregnancy massage)"]},
    {id:"must_have", label:"Which features must be ready on day one?", hint:"Tick only what you can’t open without.", type:"checkbox", options:["Public website","Online booking","Patient records","Baby records linked to mum","Staff records (NMC, DBS, training)","Video appointments","Online card payments","Email or text reminders","A login area for mums",...NS]},
    {id:"later_wishes", label:"Anything you’d love to add later?", hint:"Dreams welcome — we’ll plan them for a later phase.", type:"textarea"},
    {id:"user_types", label:"Who will need to log in?", hint:"Tick all that apply.", type:"checkbox", other:true, options:["Owner / manager","Midwives","Reception or admin staff","Finance or bookkeeper","Patients (mums)"]},
    {id:"admins_count", label:"How many people will manage the system (admins)?", type:"number"},
    {id:"patient_portal", label:"Should mums be able to log in to their own area?", type:"radio", options:["Yes – to see their notes, appointments and payments","Yes – but only appointments and payments","No, staff only",...NS]},
    {type:"heading", label:"Existing records", hint:"This affects how much setup work is needed before launch."},
    {id:"existing_records", label:"Do you have any existing records that need moving into the new system?", hint:"For example: notes about mums you already look after, staff files, or records from previous work.", type:"radio", options:["No – we’re starting fresh","Yes – a few","Yes – quite a lot",...NS]},
    {id:"records_where", label:"If yes, where are those records kept now?", hint:"Tick all that apply.", type:"checkbox", other:true, options:["Paper files","Spreadsheets (Excel / Google Sheets)","Word documents","Email folders","Another software system"]},
    {id:"records_count", label:"Roughly how many patient records would need moving?", hint:"A rough guess is fine.", type:"radio", options:["None","Under 50","50–200","More than 200",...NS]}
  ]},
  { id:"project", title:"Timeline & budget", intro:"Last few questions! This lets us plan the work and give you an accurate quote for the first version.", questions:[
    {id:"launch_date", label:"When would you like to start seeing patients with the new system?", type:"date"},
    {id:"deadline", label:"Is there a fixed date we should work towards?", hint:"For example: your opening day, a CQC visit, or a lease starting.", type:"textarea"},
    {id:"budget", label:"What budget do you have for building the first version (MVP)?", hint:"The first version covers the essentials needed to launch.", type:"radio", options:["Under £20,000","£20,000–£30,000","£30,000–£45,000","More than £45,000","Not sure – please advise"]},
    {id:"running_budget", label:"What monthly budget do you have for hosting and support?", type:"radio", options:["Under £300","£300–£600","£600–£1,000","More than £1,000","Not sure – please advise"]},
    {id:"brand", label:"What do you already have?", hint:"Tick all that apply.", type:"checkbox", options:["A logo","Brand colours","Professional photos","A web address (domain name)","None of these yet"]},
    {id:"domain", label:"If you have a web address, what is it?", hint:"For example: mymidwives.co.uk", type:"text"},
    {id:"decision_maker", label:"Who makes the final decisions and approves the work?", type:"text"},
    {id:"priorities", label:"What matters most to you?", hint:"Choose up to 3.", type:"checkbox", max:3, options:["Easy to use","Safe and secure","Ready quickly","Low cost","Looks beautiful","Mums can do things themselves"]},
    {id:"anything_else", label:"Is there anything else you’d like us to know?", type:"textarea"}
  ]},
  { id:"review", title:"Check & send", review:true }
];

/* ---------- state ---------- */
const STORE_KEY = "midwife-q-part1";
let state = {}, current = 0;
try { state = JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {}; } catch(e){ state = {}; }
function save(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){}
}

const tickSvg = '<svg viewBox="0 0 16 16" fill="none" stroke="#16220A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
const dotSvg  = tickSvg;

function el(tag, attrs={}, html){ const e=document.createElement(tag); for(const k in attrs){ if(k==="class") e.className=attrs[k]; else e.setAttribute(k,attrs[k]); } if(html!==undefined) e.innerHTML=html; return e; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------- render ---------- */
const stepsEl = document.getElementById("steps");
const navEl = document.getElementById("navlist");

SECTIONS.forEach((s, i) => {
  const step = el("section", {class:"step", "data-index":i, "aria-labelledby":"h-"+s.id});
  const head = el("div", {class:"step-head"});
  head.innerHTML = `<h2 id="h-${s.id}" tabindex="-1">${esc(s.title)}</h2>${s.intro?`<p>${esc(s.intro)}</p>`:""}`;
  step.appendChild(head);

  if (s.welcome) {
    const tips = el("div",{class:"tips"});
    tips.innerHTML = `
      <div class="tip"><strong>${esc(PAGE.time)}</strong>Answers save on this device, so you can stop and come back later.</div>
      <div class="tip"><strong>“Not sure” is fine</strong>Short answers or bullet points are perfect.</div>
      <div class="tip"><strong>No patient details</strong>Please don’t include any real patient names or information.</div>`;
    step.appendChild(tips);
  }

  if (s.review) {
    step.appendChild(el("div",{class:"callout"},"<strong>Nearly there!</strong> Have a quick look below. Tap <em>Edit</em> to change anything. If you use any paper or digital forms today (booking forms, consent forms, visit notes), please email us blank copies after sending — they help a lot."));
    step.appendChild(el("div",{id:"reviewBody"}));
  } else {
    s.questions.forEach(q => step.appendChild(q.type==="heading" ? renderHeading(q) : renderQuestion(q)));
  }
  stepsEl.appendChild(step);

  if (navEl) {
    const li = el("li"); li.dataset.index = i;
    const b = el("button",{type:"button"}, `<span class="num">${i+1}</span><span>${esc(s.title)}</span>`);
    b.addEventListener("click", () => go(i));
    li.appendChild(b); navEl.appendChild(li);
  }
});

function realQs(s){ return (s.questions||[]).filter(q => q.type!=="heading"); }
function renderHeading(q){
  return el("div",{class:"subhead"}, `<h3>${esc(q.label)}</h3>${q.hint?`<p>${esc(q.hint)}</p>`:""}`);
}
function renderQuestion(q){
  const isGroup = q.type==="radio" || q.type==="checkbox";
  const wrap = el(isGroup ? "fieldset" : "div", {class:"q", "data-qid":q.id});
  const labelHtml = `${esc(q.label)}${q.required?'<span class="req" aria-hidden="true">*</span>':'<span class="optional">(optional)</span>'}`;
  if (isGroup) wrap.appendChild(el("legend",{}, labelHtml));
  else wrap.appendChild(el("label",{class:"qlabel", for:"f-"+q.id}, labelHtml));
  if (q.hint) wrap.appendChild(el("p",{class:"hint", id:"hint-"+q.id}, esc(q.hint)));

  if (isGroup) {
    const opts = el("div",{class:"options"});
    const all = q.other ? [...q.options, "Other"] : q.options;
    all.forEach((o, idx) => {
      const id = `f-${q.id}-${idx}`;
      const lab = el("label",{class:"opt", for:id});
      const inp = el("input",{type:q.type, id, name:q.id, value:o});
      const saved = state[q.id];
      if (q.type==="radio" ? saved===o : Array.isArray(saved) && saved.includes(o)) inp.checked = true;
      inp.addEventListener("change", () => onChoice(q, wrap, inp));
      lab.appendChild(inp);
      lab.appendChild(el("span",{class:"box","aria-hidden":"true"}, q.type==="radio"?dotSvg:tickSvg));
      lab.appendChild(el("span",{}, esc(o)));
      opts.appendChild(lab);
    });
    wrap.appendChild(opts);
    if (q.other) {
      const other = el("input",{type:"text", class:"other-input", placeholder:"Please tell us…", "aria-label":q.label+" – other"});
      other.value = state[q.id+"_other"] || "";
      if (Array.isArray(state[q.id]) && state[q.id].includes("Other")) other.classList.add("show");
      other.addEventListener("input", () => { state[q.id+"_other"] = other.value; save(); flashSaved(); });
      wrap.appendChild(other);
    }
  } else {
    const attrs = {id:"f-"+q.id, name:q.id};
    if (q.hint) attrs["aria-describedby"] = "hint-"+q.id;
    if (q.required) attrs["aria-required"] = "true";
    let inp;
    if (q.type==="textarea") inp = el("textarea", attrs);
    else { inp = el("input", {...attrs, type:q.type}); if (q.type==="number") { inp.min="0"; inp.inputMode="numeric"; } }
    if (q.type==="email") inp.autocomplete="email";
    if (q.type==="tel") inp.autocomplete="tel";
    if (q.id==="contact_name") inp.autocomplete="name";
    if (q.id==="org_name") inp.autocomplete="organization";
    inp.value = state[q.id] || "";
    inp.addEventListener("input", () => { state[q.id] = inp.value; save(); flashSaved(); wrap.classList.remove("invalid"); });
    wrap.appendChild(inp);
  }
  wrap.appendChild(el("div",{class:"errmsg"}, q.type==="email" ? "Please enter a valid email address." : "Please answer this question."));
  return wrap;
}

function onChoice(q, wrap, inp){
  if (q.type==="radio") state[q.id] = inp.value;
  else {
    const checked = [...wrap.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value);
    if (q.max && checked.length > q.max) {
      inp.checked = false;
      const hint = wrap.querySelector(".hint");
      if (hint) { hint.textContent = `You can choose up to ${q.max}. Untick one to pick another.`; hint.style.color = "var(--error)"; setTimeout(()=>{ hint.textContent=q.hint; hint.style.color=""; }, 3000); }
      return;
    }
    state[q.id] = checked;
    const other = wrap.querySelector(".other-input");
    if (other) { const show = checked.includes("Other"); other.classList.toggle("show", show); if (show && inp.value==="Other") other.focus(); }
  }
  save(); flashSaved();
}

let savedTimer;
function flashSaved(){
  const n = document.getElementById("savedNote");
  n.style.opacity = "1"; n.lastChild.textContent = "Saved on this device";
  clearTimeout(savedTimer);
}

/* ---------- navigation ---------- */
const backBtn = document.getElementById("backBtn"), nextBtn = document.getElementById("nextBtn");
function go(i){
  current = Math.max(0, Math.min(i, SECTIONS.length-1));
  document.querySelectorAll(".step").forEach((s, idx) => s.classList.toggle("active", idx===current));
  document.querySelectorAll("#navlist li").forEach((li, idx) => {
    li.classList.toggle("current", idx===current);
    li.classList.toggle("done", idx<current || sectionStarted(idx));
  });
  const pct = Math.round((current+1)/SECTIONS.length*100);
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressLabel").textContent = `Step ${current+1}/${SECTIONS.length}`;
  backBtn.style.visibility = current===0 ? "hidden" : "visible";
  const last = SECTIONS[current].review;
  nextBtn.textContent = last ? "Send my answers" : (current===SECTIONS.length-2 ? "Review answers" : "Next");
  if (last) buildReview();
  document.getElementById("banner").className = "banner";
  window.scrollTo({top: document.querySelector("main").offsetTop - 20, behavior:"smooth"});
  const h = document.querySelector(".step.active h2"); if (h) h.focus({preventScroll:true});
  try { localStorage.setItem(STORE_KEY+"-step", String(current)); } catch(e){}
}
function sectionStarted(idx){
  const s = SECTIONS[idx]; if (!s.questions) return false;
  return realQs(s).some(q => { const v = state[q.id]; return Array.isArray(v) ? v.length : (v && String(v).trim()); }) && idx < current;
}
function validStep(i){
  const s = SECTIONS[i]; if (!s.questions) return true;
  let firstBad = null;
  realQs(s).forEach(q => {
    const wrap = document.querySelector(`[data-qid="${q.id}"]`);
    const v = (state[q.id]||"").toString().trim();
    let bad = q.required && !v;
    if (!bad && q.type==="email" && v) bad = !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
    wrap.classList.toggle("invalid", bad);
    if (bad && !firstBad) firstBad = wrap;
  });
  if (firstBad) { firstBad.scrollIntoView({behavior:"smooth", block:"center"}); const f = firstBad.querySelector("input,textarea"); if (f) f.focus({preventScroll:true}); return false; }
  return true;
}
backBtn.addEventListener("click", () => go(current-1));
nextBtn.addEventListener("click", () => {
  if (SECTIONS[current].review) return submit();
  if (!validStep(current)) return;
  go(current+1);
});

/* ---------- answers ---------- */
function answerText(q){
  const v = state[q.id];
  if (Array.isArray(v)) {
    let parts = v.filter(x => x!=="Other");
    if (v.includes("Other")) parts.push("Other: " + (state[q.id+"_other"] || "(not specified)"));
    return parts.join(", ");
  }
  return v ? String(v).trim() : "";
}
function collect(){
  const out = [];
  SECTIONS.forEach(s => realQs(s).forEach(q => out.push({section:s.title, question:q.label, answer:answerText(q)})));
  return out;
}
function buildReview(){
  const body = document.getElementById("reviewBody"); body.innerHTML = "";
  SECTIONS.forEach((s, i) => {
    if (!s.questions) return;
    const box = el("div",{class:"review-section"});
    const hd = el("header");
    hd.appendChild(el("h3",{}, esc(s.title)));
    const edit = el("button",{type:"button", class:"linkbtn"}, "Edit");
    edit.addEventListener("click", () => go(i));
    hd.appendChild(edit); box.appendChild(hd);
    const dl = el("dl");
    realQs(s).forEach(q => {
      const a = answerText(q);
      dl.appendChild(el("dt",{}, esc(q.label)));
      dl.appendChild(el("dd", a ? {} : {class:"empty"}, a ? esc(a) : "Not answered"));
    });
    box.appendChild(dl); body.appendChild(box);
  });
}
function plainSummary(){
  let txt = "", last = "";
  collect().forEach(r => { if (r.section!==last){ txt += `\n=== ${r.section.toUpperCase()} ===\n`; last = r.section; } txt += `${r.question}\n  → ${r.answer || "Not answered"}\n`; });
  return txt.trim();
}

/* ---------- submit ---------- */
async function submit(){
  const banner = document.getElementById("banner");
  if (document.querySelector('input[name="_honey"]').value) return; // bot
  for (let i=0;i<SECTIONS.length-1;i++){ if (!validStep(i)) { go(i); setTimeout(()=>validStep(i),350); return; } }

  const rows = collect();
  const fields = {};
  rows.forEach((r, i) => { fields[`${String(i+1).padStart(2,"0")}. [${r.section}] ${r.question}`] = r.answer || "—"; });
  const name = state.contact_name || "", email = state.contact_email || "";
  const subject = `${CONFIG.subject} – ${state.org_name || name}`;

  let url = null, payload = null;
  if (CONFIG.provider === "web3forms" && CONFIG.accessKey) {
    url = "https://api.web3forms.com/submit";
    payload = {access_key: CONFIG.accessKey, subject, from_name: name || "Questionnaire", name, email, ...fields};
  } else if (CONFIG.provider === "formspree" && CONFIG.formspreeId) {
    url = `https://formspree.io/f/${CONFIG.formspreeId}`;
    payload = {_subject: subject, name, email, ...fields};
  } else if (CONFIG.provider === "formsubmit" && CONFIG.email && !CONFIG.email.includes("yourdomain")) {
    url = `https://formsubmit.co/ajax/${encodeURIComponent(CONFIG.email)}`;
    payload = {_subject: subject, _template: "table", _captcha: "false", name, email, ...fields};
  }
  const useDb = !!(CONFIG.supabaseUrl && CONFIG.supabaseKey);
  if (!url && !useDb) return notConfigured();

  nextBtn.disabled = true; nextBtn.textContent = "Sending…";
  try {
    let saved = false, emailed = false;
    if (useDb) {
      try {
        const r = await fetch(`${CONFIG.supabaseUrl}/rest/v1/questionnaire_responses`, {
          method:"POST",
          headers:{"Content-Type":"application/json", "apikey":CONFIG.supabaseKey, "Prefer":"return=minimal"},
          body: JSON.stringify({part: CONFIG.part, contact_name: name, contact_email: email, org_name: state.org_name || "", answers: rows, user_agent: navigator.userAgent.slice(0, 500)})
        });
        saved = r.ok;
      } catch(e) {}
    }
    if (url) {
      try {
        const res = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"}, body: JSON.stringify(payload)});
        const data = await res.json().catch(()=>({}));
        emailed = res.ok && data.success !== false && data.success !== "false";
      } catch(e) {}
    }
    if (!saved && !emailed) throw new Error("Send failed");
    showThanks();
  } catch(err) {
    banner.className = "banner error";
    banner.innerHTML = "Sorry, your answers didn’t send. Please check your internet connection and try again. If it keeps happening, use <a href='#' id='dlLink'>Download a copy</a> and email it to us.";
    document.getElementById("dlLink").addEventListener("click", e => { e.preventDefault(); downloadCopy(); });
    nextBtn.disabled = false; nextBtn.textContent = "Try sending again";
  }
}
function notConfigured(){
  const banner = document.getElementById("banner");
  banner.className = "banner error";
  banner.innerHTML = "This form isn’t connected to an email address yet (see the CONFIG section in the file). For now you can <a href='#' id='dlLink'>download a copy of your answers</a>.";
  document.getElementById("dlLink").addEventListener("click", e => { e.preventDefault(); downloadCopy(); });
}
function downloadCopy(){
  const blob = new Blob([plainSummary()], {type:"text/plain"});
  const a = el("a",{href:URL.createObjectURL(blob), download:`questionnaire-${(state.org_name||"answers").replace(/[^a-z0-9]+/gi,"-").toLowerCase()}.txt`});
  document.body.appendChild(a); a.click(); a.remove();
}
function showThanks(){
  document.getElementById("progress").style.display = "none";
  document.getElementById("topbar").style.display = "none";
  document.getElementById("actions").style.display = "none";
  document.getElementById("banner").className = "banner";
  stepsEl.innerHTML = `
    <div class="thanks">
      <div class="tick"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#16220A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h2>Thank you${state.contact_name ? ", " + esc(state.contact_name.split(" ")[0]) : ""}!</h2>
      <p>Your answers have been sent. We’ll read them carefully and be in touch within two working days to arrange a short call.</p>
      <p>If you have paper or digital forms you use today, please email us blank copies — they really help.</p>
      <p style="margin-top:20px"><button type="button" class="btn btn-ghost" id="keepCopy">Download a copy for my records</button></p>
    </div>`;
  document.getElementById("keepCopy").addEventListener("click", downloadCopy);
  document.querySelectorAll("#navlist li").forEach(li => li.classList.add("done"));
  try { localStorage.removeItem(STORE_KEY); localStorage.removeItem(STORE_KEY+"-step"); } catch(e){}
  window.scrollTo({top:0, behavior:"smooth"});
}

/* ---------- start ---------- */
let startAt = 0;
try { startAt = parseInt(localStorage.getItem(STORE_KEY+"-step") || "0", 10) || 0; } catch(e){}
document.getElementById("brandmark").textContent = PAGE.label;
go(startAt);
</script>
</body>
</html>
